name: Build MobileGlues APK (Flicker Fix)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup MobileGlues core + all dependencies
        run: |
          rm -rf MobileGlues
          rm -rf .git/modules/MobileGlues || true

          git clone --depth 1 --branch main \
            https://github.com/CihuyAkz/MobileGlues-MipmapFlickeringFix.git \
            MobileGlues

          cd MobileGlues
          mkdir -p MobileGlues-cpp/3rdparty
          cd MobileGlues-cpp/3rdparty

          git clone --depth 1 https://github.com/KhronosGroup/glslang.git
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Cross.git
          git clone --depth 1 https://github.com/Cyan4973/xxHash.git xxhash
          git clone --depth 1 https://github.com/MobileGL-Dev/flat_hash_map.git

          mkdir -p ../includes/ska
          cp -r flat_hash_map/* ../includes/ska/ 2>/dev/null || true
          mkdir -p ska
          cp flat_hash_map/flat_hash_map.hpp ska/ 2>/dev/null || true

          cd ../../..

      - name: Set date & repo name
        run: |
          echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "repository_name=\( (echo ' \){{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;27.3.13750724"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.3.13750724" >> local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build tanpa signing (unsigned APK)
      - name: Build APK (Unsigned)
        run: |
          # Matikan signing supaya tidak error password
          ./gradlew assembleRelease -x packageRelease || true
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: \( {{ env.repository_name }}_ \){{ env.date_today }}_${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
